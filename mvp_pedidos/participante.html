<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pedido - SIPES</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para la vista móvil del jugador */
        body { background-color: #F3F4F6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 1rem; }
        .mobile-container { width: 100%; max-width: 450px; margin-top: 1rem; }
        .mobile-header { text-align: center; margin-bottom: 1.5rem; }
        .mobile-header .logo i { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; }
        .mobile-header h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .mobile-header p { font-size: 0.875rem; color: var(--text-muted); }
        
        .card { border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .card-header { background: linear-gradient(135deg, #4F46E5, #3B82F6); color: white; text-align: center; border-radius: 1rem 1rem 0 0; padding: 1.5rem; }
        .card-header h2 { color: white; justify-content: center; font-size: 1.25rem; }
        .card-header p { font-size: 0.875rem; opacity: 0.9; margin-top: 0.25rem; }
        
        .form-section { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px dashed var(--border-color); }
        .form-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="mobile-header">
            <div class="logo"><i class="fa-solid fa-shirt"></i></div>
            <h1>Sublitex</h1>
            <p>Registro de Jugadores</p>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-user-pen"></i> Mis Datos</h2>
                <p>Pedido: Promo 2002 - Colegio San José</p>
            </div>
            <div class="card-body">
                <div id="alertsContainer" class="alerts-container"></div>
                
                <form id="playerForm">
                    <input type="hidden" id="participantId">
                    
                    <div class="form-section">
                        <div class="form-group">
                            <label for="playerName">Tu Nombre Real (Opcional)</label>
                            <input type="text" id="playerName" placeholder="Ej. Juan Pérez">
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-main);"><i class="fa-solid fa-shirt" style="color: var(--primary)"></i> Detalles de tu Camiseta</h3>
                        <div class="form-group">
                            <label for="shirtName">Nombre Estampado (Espalda) <span class="required">*</span></label>
                            <input type="text" id="shirtName" required placeholder="Ej. JUAN P." maxlength="15">
                            <small style="color: var(--text-muted); font-size: 0.75rem;">Cómo quieres que se lea en tu camiseta (Max 15 carácteres).</small>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="shirtNumber">Número <span class="required">*</span></label>
                                <input type="number" id="shirtNumber" required min="0" max="99" placeholder="10">
                            </div>
                            <div class="form-group">
                                <label for="size">Talla <span class="required">*</span> <a href="#" onclick="alert('Guía: S(48x68cm), M(52x70cm), L(56x72cm), XL(60x74cm)')" style="font-size: 0.75rem; color: var(--primary); font-weight: normal; margin-left: 5px;"><i class="fa-solid fa-ruler"></i> Ver Guía</a></label>
                                <select id="size" required>
                                    <option value="">Seleccione...</option>
                                    <option value="10">10 (Niño)</option>
                                    <option value="14">14 (Niño)</option>
                                    <option value="S">S</option>
                                    <option value="M">M</option>
                                    <option value="L">L</option>
                                    <option value="XL">XL</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-group">
                            <label for="productType">¿Qué pedirás? <span class="required">*</span></label>
                            <select id="productType" required>
                                <option value="conjunto">Conjunto Completo (Camiseta + Short)</option>
                                <option value="camiseta">Solo Camiseta</option>
                            </select>
                        </div>
                        <div class="form-group" id="shortSizeGroup">
                            <label for="shortSize">Talla de Short</label>
                            <select id="shortSize">
                                <option value="">Igual que la camiseta</option>
                                <option value="10">10 (Niño)</option>
                                <option value="14">14 (Niño)</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                            </select>
                            <small style="color: var(--text-muted); font-size: 0.75rem;">Déjalo en blanco si usas la misma talla arriba y abajo.</small>
                        </div>
                        <div class="form-group" style="display:none;">
                            <input type="hidden" id="genderCut" value="Hombre">
                        </div>
                        <div class="form-group checkbox-group" style="margin-top: 1rem; display: flex; align-items: center; gap: 8px; background: #FEE2E2; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #F87171;">
                            <input type="checkbox" id="isGoalkeeper">
                            <label for="isGoalkeeper" style="margin-bottom: 0; font-weight: 600; color: #991B1B; cursor: pointer;">🧤 Soy el Arquero (Portero)</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" style="font-size: 1rem; padding: 1rem;"><i class="fa-solid fa-check"></i> Guardar Mis Datos</button>
                </form>
                <div style="margin-top: 1rem; text-align: center;">
                    <a href="index.html" style="font-size: 0.875rem; color: var(--text-muted); text-decoration: underline;">Volver a vista del Coordinador (Testing)</a>
                </div>
            </div>
        </div>
    </div>

    <script src="participante.js"></script>
</body>
</html>
