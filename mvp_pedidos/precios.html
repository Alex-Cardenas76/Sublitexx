<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPES · Tabla de Precios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== Subtabla de Precios ===== */
        .precios-card { max-width: 900px; }
        .precios-note {
            font-size: 0.8rem; color: var(--text-muted);
            display: flex; align-items: center; gap: 0.5rem;
            flex-wrap: wrap;
        }
        .precios-note .live-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--secondary); display: inline-block;
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

        table.precios {
            width: 100%; border-collapse: collapse; margin-top: 0.25rem;
        }
        table.precios th {
            text-align: left; font-size: 0.72rem; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--text-muted);
            padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border-color);
        }
        table.precios td {
            padding: 0.85rem 0.75rem; border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        table.precios tr:last-child td { border-bottom: none; }

        .tipo-prenda { display: flex; align-items: center; gap: 0.65rem; font-weight: 600; }
        .tipo-icon {
            width: 38px; height: 38px; border-radius: 10px;
            display: grid; place-items: center; font-size: 1rem; color: #fff;
        }
        .ti-conjunto   { background: #0891B2; }
        .ti-arquero    { background: #DC2626; }
        .ti-camiseta   { background: #EC4899; }

        .cant-badge {
            display: inline-block; min-width: 34px; text-align: center;
            background: #E6FBFF; color: #0891B2; font-weight: 700;
            padding: 0.2rem 0.6rem; border-radius: var(--radius-full);
            font-size: 0.9rem;
        }
        .precio-unit { color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .subtotal    { font-weight: 700; font-variant-numeric: tabular-nums; }

        .precios-total-row td {
            border-top: 2px solid var(--primary); border-bottom: none;
            padding-top: 1rem; font-weight: 700; font-size: 1.05rem;
        }
        .gran-total {
            font-size: 1.35rem; color: var(--primary); font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .precios-factores {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.25rem;
        }
        .factor-box {
            background: #F9FAFB; border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 0.9rem 1rem;
        }
        .factor-box .fb-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
        .factor-box .fb-value { font-weight: 700; font-size: 1.1rem; margin-top: 0.15rem; font-variant-numeric: tabular-nums; }

        .empty-precios {
            text-align: center; color: var(--text-muted); padding: 3rem 1rem;
        }
        .empty-precios i { font-size: 2.5rem; color: #C7CDD6; margin-bottom: 0.75rem; }

        .money-symbol { color: var(--text-muted); font-weight: 600; margin-right: 2px; }

        .copy-bar {
            display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem;
            align-items: center; justify-content: space-between;
        }
        .copy-bar .total-line { font-size: 0.85rem; color: var(--text-muted); }

        @media (max-width: 640px) {
            .precios-factores { grid-template-columns: 1fr; }
            .copy-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-shirt"></i>
                    <span>Sublitex</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-clipboard-list"></i> Pedido Actual</a>
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-folder"></i> Todos los Pedidos</a>
                <a href="precios.html" class="nav-item active"><i class="fa-solid fa-calculator"></i> Tabla de Precios</a>
                <a href="produccion.html" class="nav-item"><i class="fa-solid fa-industry"></i> Producción y Costos</a>
                <a href="diseno.html" class="nav-item"><i class="fa-solid fa-palette"></i> Diseño Gráfico</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">CO</div>
                    <div class="details">
                        <span class="name">Coordinador Operativo</span>
                        <span class="role">Vista Administrativa</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb">
                    <i class="fa-solid fa-calculator" style="margin-right:0.5rem;"></i>
                    <span class="current">Tabla de Precios (Subtotal por Tipo de Prenda)</span>
                </div>
                <div class="actions">
                    <span class="precios-note"><span class="live-dot"></span> Se calcula solo desde los participantes del pedido</span>
                </div>
            </header>

            <div class="dashboard-grid">
                <!-- Subtabla de precios -->
                <div class="card precios-card">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-receipt"></i> Resumen de Precios Calculados</h2>
                    </div>
                    <div class="card-body">
                        <div id="preciosContainer"></div>
                    </div>
                </div>

                <!-- Factores / Totales -->
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-coins"></i> Totales</h2>
                    </div>
                    <div class="card-body">
                        <div id="factoresContainer"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ===== Configuración de precios unitarios =====
        // Línea de negocio de Sublitex: el arquero paga una tarifa distinta del jugador.
        const CONFIG_PRECIOS = {
            'conjunto-jugador': { nombre: 'Conjunto de Jugador', precio: 45, icono: 'fa-shirt', iconoCls: 'ti-conjunto' },
            'conjunto-arquero': { nombre: 'Conjunto de Arquero', precio: 50, icono: 'fa-helmet-safety', iconoCls: 'ti-arquero' },
            'camiseta':        { nombre: 'Solo Camiseta',       precio: 25, icono: 'fa-shirt', iconoCls: 'ti-camiseta' }
        };

        // Misma clave que usa la tabla principal (app.js / participante.js)
        const STORE_KEY = 'sipes_participants';
        const MONEDA = 'S/';

        function cargarParticipantes() {
            try {
                const data = localStorage.getItem(STORE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        // Contar los participantes reales por categoría (nunca campos manuales).
        function calcularResumen() {
            const participantes = cargarParticipantes();
            const resumen = {
                'conjunto-jugador': 0,
                'conjunto-arquero': 0,
                'camiseta': 0
            };
            let totalPrendas = 0;

            participantes.forEach(p => {
                const esConjunto = p.productType === 'conjunto' || p.productType === 'conjuntos';
                const esArquero = !!p.isGoalkeeper;

                if (esConjunto) {
                    if (esArquero) resumen['conjunto-arquero']++;
                    else resumen['conjunto-jugador']++;
                } else {
                    // Solo camiseta (jugador o arquero entra como camiseta simple por precio único)
                    resumen['camiseta']++;
                }
                totalPrendas++;
            });

            return { resumen, totalPrendas };
        }

        function renderTablaPrecios() {
            const { resumen, totalPrendas } = calcularResumen();
            const container = document.getElementById('preciosContainer');

            const filas = Object.keys(CONFIG_PRECIOS).map(clave => {
                const cfg = CONFIG_PRECIOS[clave];
                const cantidad = resumen[clave];
                const subtotal = cantidad * cfg.precio;
                return `
                    <tr>
                        <td>
                            <div class="tipo-prenda">
                                <div class="tipo-icon ${cfg.iconoCls}"><i class="fa-solid ${cfg.icono}"></i></div>
                                <span>${cfg.nombre}</span>
                            </div>
                        </td>
                        <td><span class="cant-badge">${cantidad}</span></td>
                        <td class="precio-unit"><span class="money-symbol">${MONEDA}</span>${cfg.precio}</td>
                        <td class="subtotal"><span class="money-symbol">${MONEDA}</span>${subtotal}</td>
                    </tr>
                `;
            }).join('');

            const granTotal = Object.keys(CONFIG_PRECIOS).reduce((acc, k) => acc + (resumen[k] * CONFIG_PRECIOS[k].precio), 0);

            container.innerHTML = `
                ${totalPrendas === 0 ?
                    `<div class="empty-precios">
                        <i class="fa-solid fa-receipt"></i>
                        <div>No hay participantes registrados todavía.</div>
                        <div style="font-size:0.85rem; margin-top:0.4rem;">Registra jugadores en el <a href="index.html">Pedido Actual</a> y esta tabla se completa sola.</div>
                    </div>` :
                    `<div class="table-responsive">
                        <table class="precios">
                            <thead>
                                <tr>
                                    <th>Tipo de prenda</th>
                                    <th>Cantidad</th>
                                    <th>Precio unit.</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>${filas}</tbody>
                            <tfoot>
                                <tr class="precios-total-row">
                                    <td colspan="2">Total ${totalPrendas} prenda${totalPrendas !== 1 ? 's' : ''}</td>
                                    <td></td>
                                    <td class="gran-total"><span class="money-symbol">${MONEDA}</span>${granTotal}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>`}
            `;

            renderFactores(resumen, granTotal, totalPrendas);
        }

        function renderFactores(resumen, granTotal, totalPrendas) {
            const container = document.getElementById('factoresContainer');
            const ceros = Object.keys(resumen).filter(k => resumen[k] === 0);
            container.innerHTML = `
                <div class="precios-factores">
                    <div class="factor-box">
                        <div class="fb-label">Total prendas</div>
                        <div class="fb-value">${totalPrendas}</div>
                    </div>
                    <div class="factor-box">
                        <div class="fb-label">Total general</div>
                        <div class="fb-value" style="color:var(--primary)"><span class="money-symbol">${MONEDA}</span>${granTotal}</div>
                    </div>
                </div>
                ${ceros.length === 3 ?
                    '<div class="empty-precios" style="padding:2rem 0;"><i class="fa-solid fa-info-circle"></i><div>Sin participantes aún.</div></div>' : ''}
            `;
        }

        // Recalcular automáticamente cuando cambia la tabla principal (mismo localStorage).
        window.addEventListener('storage', renderTablaPrecios);
        document.addEventListener('DOMContentLoaded', renderTablaPrecios);
        renderTablaPrecios();
    </script>
</body>
</html>
