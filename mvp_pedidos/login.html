<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPES - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #2563EB 130%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            color: #1e293b;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 20px;
            padding: 2.25rem;
            box-shadow: 0 20px 60px rgba(2, 6, 23, 0.45);
        }
        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }
        .login-logo .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }
        .login-logo h1 { font-size: 1.3rem; font-weight: 900; letter-spacing: -0.03em; color: #0F172A; }
        .login-sub { font-size: 0.85rem; color: #64748b; margin-bottom: 1.75rem; line-height: 1.5; }
        .field { margin-bottom: 1.1rem; }
        .field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #475569;
            margin-bottom: 0.4rem;
        }
        .field input {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        .field input:focus {
            border-color: #2563EB;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .field input.error {
            border-color: #DC2626;
            background: #FEF2F2;
        }
        .err-msg {
            display: none;
            font-size: 0.8rem;
            color: #DC2626;
            margin-top: 0.5rem;
            font-weight: 600;
        }
        .err-msg.show { display: block; }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }
        .btn-login:hover { box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4); }
        .btn-login:active { transform: scale(0.98); }
        .login-hint {
            margin-top: 1.25rem;
            padding: 0.8rem 1rem;
            background: #F1F5F9;
            border-radius: 10px;
            border: 1px solid #E2E8F0;
        }
        .login-hint .hint-title {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.35rem;
        }
        .login-hint code {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 0.15rem 0.4rem;
            border-radius: 6px;
            font-size: 0.78rem;
            color: #1e40af;
            font-weight: 700;
        }
        .login-hint p { font-size: 0.8rem; color: #475569; margin-bottom: 0.25rem; }
        .loading {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="icon"><i class="fa-solid fa-shirt"></i></div>
            <h1>SIPES</h1>
        </div>
        <p class="login-sub">Inicia sesión para acceder al Panel Central de Operaciones de Sublitex.</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="admin" autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <div class="err-msg" id="errMsg">Usuario o contraseña incorrectos.</div>
            <button type="submit" class="btn-login" id="btnLogin">
                <span id="btnText">Ingresar</span>
                <span class="loading" id="btnLoading"></span>
            </button>
        </form>

        <div class="login-hint">
            <div class="hint-title">Datos de acceso (mock)</div>
            <p>Usuario: <code>admin</code> &nbsp;·&nbsp; Contraseña: <code>admin123</code></p>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Credenciales mock (por ahora solo admin; en el futuro se cargan de backend/API)
        const USERS = [
            { username: 'admin', password: 'admin123', name: 'Administrador' },
            { username: 'coord', password: 'coord123', name: 'Coordinador' }
        ];

        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errMsg = document.getElementById('errMsg');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            errMsg.classList.remove('show');
            usernameInput.classList.remove('error');
            passwordInput.classList.remove('error');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                errMsg.textContent = 'Ingresa usuario y contraseña.';
                errMsg.classList.add('show');
                if (!username) usernameInput.classList.add('error');
                if (!password) passwordInput.classList.add('error');
                return;
            }

            const user = USERS.find(u => u.username === username && u.password === password);
            if (!user) {
                errMsg.textContent = 'Usuario o contraseña incorrectos.';
                errMsg.classList.add('show');
                usernameInput.classList.add('error');
                passwordInput.classList.add('error');
                return;
            }

            // Guardar sesión (mock) y redirigir al panel global
            localStorage.setItem('sipes_user', JSON.stringify({
                username: user.username,
                name: user.name
            }));

            btnLogin.disabled = true;
            btnText.textContent = 'Ingresando...';
            btnLoading.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 700);
        });
    </script>
</body>
</html>
